apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-core-api
  labels:
    app: banking-core-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-core-api
  template:
    metadata:
      labels:
        app: banking-core-api
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: banking-core-api
          image: banklabacr2026.azurecr.io/banking-core-api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: banking-core-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: banking-core-api