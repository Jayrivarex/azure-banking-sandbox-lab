apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-core-api
  namespace: default
  labels:
    app: banking-core-api
    environment: sandbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-core-api
  template:
    metadata:
      labels:
        app: banking-core-api
    spec:
      containers:
      - name: api
        image: banklabacr2026.azurecr.io/banking-core-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: banking-core-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: banking-core-api
  ports:
  - port: 80
    targetPort: 8080