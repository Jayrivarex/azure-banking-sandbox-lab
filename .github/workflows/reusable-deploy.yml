name: Reusable Deploy to AKS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      azure-client-id:
        required: true
        type: string
      azure-client-secret:
        required: true
        type: string

jobs:
  deploy:
    name: Despliegue en AKS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Azure y AKS
        uses: ./.github/actions/setup-azure-env
        with:
          azure-client-id: ${{ inputs.azure-client-id }}
          azure-client-secret: ${{ inputs.azure-client-secret }}

      - name: Sustituir tag de imagen en manifiestos K8s
        shell: bash
        run: |
          sed -i 's|image: .*|image: banklabacr2026.azurecr.io/banking-core-api:${{ inputs.image-tag }}|g' k8s/deployment.yaml

      - name: Aplicar manifiestos en AKS y verificar
        shell: bash
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/banking-core-api --timeout=120s