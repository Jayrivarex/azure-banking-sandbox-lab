name: Reusable Deploy to AKS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string

jobs:
  deploy:
    name: Despliegue en AKS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Azure y AKS
        uses: ./.github/actions/setup-azure-env
        with:
          resource-group: '1-5932e71d-playground-sandbox'
          aks-cluster-name: 'banklab-aks-cluster'
          azure-username: ${{ secrets.AZURE_USERNAME }}
          azure-password: ${{ secrets.AZURE_PASSWORD }}

      - name: Sustituir tag de imagen en manifiestos K8s
        shell: bash
        run: |
          echo "Actualizando imagen a: banklabacr2026.azurecr.io/banking-core-api:${{ inputs.image-tag }}"
          sed -i 's|image: .*|image: banklabacr2026.azurecr.io/banking-core-api:${{ inputs.image-tag }}|g' k8s/deployment.yaml

      - name: Aplicar manifiestos en AKS (Kubernetes Manifests)
        shell: bash
        run: |
          echo "Aplicando configuraciones en el clúster Kubernetes..."
          kubectl apply -f k8s/deployment.yaml
          
          echo "Verificando el estado del despliegue..."
          kubectl rollout status deployment/banking-core-api --timeout=120s