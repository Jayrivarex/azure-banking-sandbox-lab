name: 'Setup Azure Environment'
description: 'Configura la autenticación en Azure con usuario, contraseña y tenant del sandbox'

inputs:
  resource-group:
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    required: true
    default: 'banklab-aks-cluster'
  azure-username:
    required: true
  azure-password:
    required: true

runs:
  using: "composite"
  steps:
    - name: Autenticación en Azure CLI (User Login con Tenant)
      shell: bash
      env:
        AZURE_USERNAME: ${{ inputs.azure-username }}
        AZURE_PASSWORD: ${{ inputs.azure-password }}
      run: |
        if [ -z "$AZURE_USERNAME" ] || [ -z "$AZURE_PASSWORD" ]; then
          echo "ERROR CRITICO: AZURE_USERNAME o AZURE_PASSWORD estan vacios."
          exit 1
        fi

        az login --username "$AZURE_USERNAME" --password "$AZURE_PASSWORD" --tenant "realhandsonlabs.com"

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.aks-cluster-name }}" \
          --overwrite-existing