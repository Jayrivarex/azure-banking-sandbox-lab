name: 'Setup Azure Environment'
description: 'Autenticación con usuario del sandbox y el Directory ID correcto'

inputs:
  resource-group:
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    required: true
    default: 'banklab-aks-cluster'
  azure-username:
    required: true
  azure-password:
    required: true

runs:
  using: "composite"
  steps:
    - name: Login en Azure CLI con el Tenant ID correcto
      shell: bash
      env:
        AZURE_USERNAME: ${{ inputs.azure-username }}
        AZURE_PASSWORD: ${{ inputs.azure-password }}
      run: |
        if [ -z "$AZURE_USERNAME" ] || [ -z "$AZURE_PASSWORD" ]; then
          echo "ERROR CRITICO: Las credenciales están vacías."
          exit 1
        fi

        echo "Iniciando sesión con el usuario del sandbox y Directory ID correcto..."
        az login --username "$AZURE_USERNAME" --password "$AZURE_PASSWORD" --tenant "84f1e4ea-8554-43e1-8709-f0b8589ea118"

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.aks-cluster-name }}" \
          --overwrite-existing