name: 'Setup Azure Environment'
description: 'Configura la autenticación en Azure por usuario, CLI y el contexto de Kubernetes'

inputs:
  resource-group:
    description: 'Nombre del Resource Group en Azure'
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    description: 'Nombre del clúster AKS'
    required: true
    default: 'banklab-aks-cluster'
  azure-username:
    description: 'Azure Sandbox Username'
    required: true
  azure-password:
    description: 'Azure Sandbox Password'
    required: true

runs:
  using: "composite"
  steps:
    - name: Autenticación en Azure CLI (User Login)
      shell: bash
      run: |
        az login -u "${{ inputs.azure-username }}" -p "${{ inputs.azure-password }}"

    - name: Verificar versión y contexto activo de Azure
      shell: bash
      run: |
        az account show
        az version
        kubectl version --client

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group ${{ inputs.resource-group }} \
          --name ${{ inputs.aks-cluster-name }} \
          --overwrite-existing