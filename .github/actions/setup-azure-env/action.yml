name: 'Setup Azure Environment'
description: 'Configura la autenticación en Azure limpiando posibles espacios en los secretos del sandbox'

inputs:
  resource-group:
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    required: true
    default: 'banklab-aks-cluster'
  azure-username:
    required: true
  azure-password:
    required: true

runs:
  using: "composite"
  steps:
    - name: Autenticación en Azure CLI (Con sanitización de credenciales)
      shell: bash
      env:
        RAW_USERNAME: ${{ inputs.azure-username }}
        RAW_PASSWORD: ${{ inputs.azure-password }}
      run: |
        # Limpiar espacios en blanco o saltos de línea accidentales del copy-paste
        AZURE_USERNAME=$(echo "$RAW_USERNAME" | xargs)
        AZURE_PASSWORD=$(echo "$RAW_PASSWORD" | xargs)

        if [ -z "$AZURE_USERNAME" ] || [ -z "$AZURE_PASSWORD" ]; then
          echo "ERROR CRITICO: Las credenciales de Azure están vacías."
          exit 1
        fi

        echo "Iniciando sesión en Azure con el usuario del sandbox..."
        az login --username "$AZURE_USERNAME" --password "$AZURE_PASSWORD" --tenant "realhandsonlabs.com"

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.aks-cluster-name }}" \
          --overwrite-existing