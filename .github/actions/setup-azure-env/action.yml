name: 'Setup Azure Environment'
description: 'Configura la autenticación en Azure por Service Principal y el contexto de Kubernetes'

inputs:
  resource-group:
    description: 'Nombre del Resource Group en Azure'
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    description: 'Nombre del clúster AKS'
    required: true
    default: 'banklab-aks-cluster'
  azure-client-id:
    description: 'Azure Client ID'
    required: true
  azure-client-secret:
    description: 'Azure Client Secret'
    required: true

runs:
  using: "composite"
  steps:
    - name: Autenticación en Azure CLI (Service Principal)
      shell: bash
      run: |
        az login --service-principal \
          --username "${{ inputs.azure-client-id }}" \
          --password "${{ inputs.azure-client-secret }}" \
          --tenant "realhandsonlabs.com"

    - name: Verificar versión y contexto activo de Azure
      shell: bash
      run: |
        az account show
        kubectl version --client

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group ${{ inputs.resource-group }} \
          --name ${{ inputs.aks-cluster-name }} \
          --overwrite-existing