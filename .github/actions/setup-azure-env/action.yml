name: 'Setup Azure Environment'
description: 'Configura la autenticación oficial en Azure con Service Principal y el contexto de Kubernetes'

inputs:
  resource-group:
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    required: true
    default: 'banklab-aks-cluster'
  azure-client-id:
    required: true
  azure-client-secret:
    required: true

runs:
  using: "composite"
  steps:
    - name: Login en Azure (Service Principal Oficial)
      uses: azure/login@v1
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: 'realhandsonlabs.com'
        client-secret: ${{ inputs.azure-client-secret }}

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.aks-cluster-name }}" \
          --overwrite-existing