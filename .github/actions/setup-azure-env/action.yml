name: 'Setup Azure Environment'
description: 'Autenticación como Service Principal usando las credenciales del sandbox'

inputs:
  resource-group:
    required: true
    default: '1-5932e71d-playground-sandbox'
  aks-cluster-name:
    required: true
    default: 'banklab-aks-cluster'
  azure-username:
    required: true
  azure-password:
    required: true

runs:
  using: "composite"
  steps:
    - name: Login Service Principal en Azure CLI
      shell: bash
      env:
        SP_CLIENT_ID: ${{ inputs.azure-username }}
        SP_CLIENT_SECRET: ${{ inputs.azure-password }}
      run: |
        if [ -z "$SP_CLIENT_ID" ] || [ -z "$SP_CLIENT_SECRET" ]; then
          echo "ERROR CRITICO: Las credenciales están vacías."
          exit 1
        fi

        echo "Autenticando como Service Principal en Azure..."
        az login --service-principal \
          --username "$SP_CLIENT_ID" \
          --password "$SP_CLIENT_SECRET" \
          --tenant "realhandsonlabs.com"

    - name: Obtener credenciales del clúster AKS
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group "${{ inputs.resource-group }}" \
          --name "${{ inputs.aks-cluster-name }}" \
          --overwrite-existing